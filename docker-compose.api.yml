# Opcional: roda a API também em contêiner. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.api.yml up -d --build
# Exige CORS_ORIGIN e ADMIN_API_KEY no .env. Para rodar a API direto na VM, veja deploy/.
services:
  api:
    build: .
    container_name: dengue-alert-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-dengue_alert};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      Database__ServerVersion: "8.4.0"
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?defina CORS_ORIGIN no .env}
      Admin__ApiKey: ${ADMIN_API_KEY:?defina ADMIN_API_KEY no .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped
