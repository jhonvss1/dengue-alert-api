services:
  mysql:
    image: mysql:8.4
    container_name: dengue-alert
    environment:
      MYSQL_ROOT_PASSWORD: "246810"
      MYSQL_DATABASE: "dengue_alert"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "apialertadengue2025"
      TZ: "America/Sao_Paulo"
    ports:
      - "3308:3306"   
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
